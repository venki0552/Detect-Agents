name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  attack-harness:
    # Real-browser attack scenarios; slower, so manual or on main only.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    # Pinned on purpose: Playwright only ships browser builds for the Ubuntu releases it knows.
    # `ubuntu-latest` moved to 26.04, which Playwright 1.56 rejects ("does not support chromium on
    # ubuntu26.04-x64"). Move this forward together with the Playwright version (docs/DECISIONS.md D36).
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # Collector behaviour in a real browser (what goes on the wire). Not yet verified on the bundled Chromium build.
      - run: npm run test:browser
      - run: ATTACK_JSON=attack-results.json npm run attack
      - uses: actions/upload-artifact@v4
        with: { name: attack-results, path: attack-results.json }
